<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Master Data — Billing Rental PlayStation</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Billing Rental PlayStation</div>
  <nav class="nav">
    <a href="/">Dashboard</a>
    <a href="/master" class="active">Master Data</a>
    <a href="/laporan">Laporan</a>
  </nav>
  <div class="topbar-right"></div>
</header>

<main>
  <section class="panel">
    <h2>Tipe Konsol</h2>
    <table class="data" id="tblConsole"><thead>
      <tr><th>Nama</th><th>Tarif / jam</th><th></th></tr>
    </thead><tbody></tbody></table>
    <form class="inline-form" id="formConsole">
      <input name="nama" placeholder="Nama (cth: PS5)" required>
      <input name="tarif_per_jam" type="number" min="1" placeholder="Tarif/jam (Rp)" required>
      <button class="primary" type="submit">Tambah</button>
      <button type="button" id="batalConsole" hidden>Batal</button>
    </form>
  </section>

  <section class="panel">
    <h2>Paket</h2>
    <table class="data" id="tblPackage"><thead>
      <tr><th>Tipe konsol</th><th>Nama</th><th>Durasi</th><th>Harga</th><th></th></tr>
    </thead><tbody></tbody></table>
    <form class="inline-form" id="formPackage">
      <select name="console_type_id" id="selPackageType" required></select>
      <input name="nama" placeholder="Nama (cth: 2 Jam)" required>
      <input name="durasi_menit" type="number" min="1" placeholder="Durasi (menit)" required>
      <input name="harga" type="number" min="1" placeholder="Harga (Rp)" required>
      <button class="primary" type="submit">Tambah</button>
      <button type="button" id="batalPackage" hidden>Batal</button>
    </form>
  </section>

  <section class="panel">
    <h2>Unit</h2>
    <table class="data" id="tblUnit"><thead>
      <tr><th>Nama</th><th>Tipe konsol</th><th></th></tr>
    </thead><tbody></tbody></table>
    <form class="inline-form" id="formUnit">
      <input name="nama" placeholder="Nama (cth: PS5-04)" required>
      <select name="console_type_id" id="selUnitType" required></select>
      <button class="primary" type="submit">Tambah</button>
      <button type="button" id="batalUnit" hidden>Batal</button>
    </form>
  </section>
</main>

<script src="/static/master.js"></script>
</body>
</html>
